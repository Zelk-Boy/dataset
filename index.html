<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Charts</title>
    <style>
       
:root {
    color-scheme: light;
    --page: #eef3f9;
    --surface: #ffffff;
    --ink: #1d2b41;
    --muted: #64748b;
    --line: #d6deec;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

main {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 20px;
}

.charts {
    display: grid;
    gap: 24px;
}

.chart {
    min-width: 0;
    margin: 0;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
}

.chart img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    border-radius: 10px;
    background: #fff;
}

figcaption {
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.96rem;
    font-weight: 700;
    letter-spacing: 0.01em;
}

.page-header {
    margin-bottom: 24px;
}

h1 {
    margin: 0 0 12px;
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    line-height: 1.15;
}

.paper-link {
    color: #2453a6;
    font-weight: 700;
    text-underline-offset: 3px;
}

/* Mobile adjustments */
@media (max-width: 600px) {
    main {
        padding: 20px 12px;
    }

    .chart {
        padding: 12px;
        border-radius: 12px;
    }

    .charts {
        gap: 16px;
    }

    figcaption {
        font-size: 0.9rem;
    }
}
    </style>
</head>
<body>
    <main>
        <header class="page-header">
            <h1>The Effect of Different Engine Types in a Model Rocket on Distance From Launchpad</h1>
            <a class="paper-link" href="paper.html">Read the scientific paper</a>
        </header>

        <section class="charts" aria-label="Rocket charts">
            <figure class="chart">
                <img src="chart1.png" alt="Air time data chart">
                <figcaption>Air Time Data</figcaption>
            </figure>

            <figure class="chart">
                <img src="chart2.png" alt="Distance from launchpad data chart">
                <figcaption>Distance From Launchpad Data</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
